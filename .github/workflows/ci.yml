# Build and test the api (Rust) and the web app (Next.js); the hermetic e2e suite; the sandbox
# image on demand. Every `uses:` is pinned by commit sha with its tag in the trailing comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sandbox:
        description: build the sandbox image and run the gated tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: true, token: "${{ secrets.CIRCUITS_TOKEN }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branch head, 2026-10-05)
      - name: components for the pinned toolchain
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: api }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npx --yes npm@11 ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  sandbox:
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: true, token: "${{ secrets.CIRCUITS_TOKEN }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (branch head, 2026-10-05)
      - name: build the image (its own hc checks run inside)
        run: |
          out=$(sandbox/build.sh)
          tag=$(printf '%s\n' "$out" | tail -n 1)
          case "$tag" in terminal-sandbox:*) ;; *) echo "build.sh did not end with an image tag: $tag" >&2; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: gated sandbox tests
        working-directory: api
        run: TERMINAL_SANDBOX=$TAG cargo test -p terminal-sandbox --test image -- --test-threads=1
