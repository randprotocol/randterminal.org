limit_req_zone $binary_remote_addr zone=tapi:10m rate=20r/s;

# If Cloudflare proxies randterminal.org, uncomment and keep the ranges current
# (https://www.cloudflare.com/ips-v4, /ips-v6) so $remote_addr is the real client:
#   set_real_ip_from 173.245.48.0/20;  ... one line per range ...
#   real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name randterminal.org www.randterminal.org;
    return 301 https://randterminal.org$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.randterminal.org;
    ssl_certificate     /etc/letsencrypt/live/randterminal.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/randterminal.org/privkey.pem;
    return 301 https://randterminal.org$request_uri;
}
server {
    listen 443 ssl http2;
    server_name randterminal.org;
    ssl_certificate     /etc/letsencrypt/live/randterminal.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/randterminal.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 4m;

    # Server-sent events: no buffering, long reads.
    location ~ ^/api/v1/jobs/[0-9a-f]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_set_header Host $host;
        # One hop, set (not appended) so a client-supplied header never reaches the api.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=tapi burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
