# Port-80-only server block used once, before the certificate exists (nginx.conf needs the cert files
# to even load). Install this as /etc/nginx/sites-enabled/randterminal.org, then:
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot -d randterminal.org -d www.randterminal.org
# and replace it with nginx.conf.
server {
    listen 80;
    server_name randterminal.org www.randterminal.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
